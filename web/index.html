<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manuel Juncal</title>
<meta name="theme-color" content="#11150F">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Marcellus&display=swap">
<style>
:root{
  --bg:#11150F; --line:#2E382B;
  --ink:#F0EADC; --muted:#B7C0AF; --faint:#8E9986; --gold:#E3A64F;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; min-height:100vh}
main{padding:40px 24px; text-align:center; max-width:420px}
.eyebrow{font-size:11px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--gold)}
h1{font-family:Marcellus,Georgia,serif; font-weight:400; letter-spacing:.02em;
  font-size:clamp(30px,8vw,40px); line-height:1.1; margin:12px 0 0}
.rule{width:34px; height:1px; background:var(--line); margin:22px auto}
p{color:var(--faint); margin:0}
a{color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line);
  padding-bottom:1px; transition:color .16s ease, border-color .16s ease}
a:hover{color:var(--gold); border-color:var(--gold)}
</style>
</head>
<body>
<main>
  <span class="eyebrow">Frontend</span>
  <h1>Manuel Juncal</h1>
  <div class="rule"></div>
  <p><a href="mailto:manueljuncalacuna@gmail.com">manueljuncalacuna@gmail.com</a></p>
</main>
</body>
</html>
